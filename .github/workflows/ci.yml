# Ship Pass 2, Phase 8 — the gate every push must clear: type-check, unit tests,
# production build. The gauntlet (browser captures) stays local; it needs a GPU.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The headless suites include ten that talk to Postgres through lib/db. They have no
    # internal env gate — without DATABASE_URL they throw on client construction — so CI
    # gives them a real database rather than letting ci-suite skip them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: FEL-full-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FEL-full-app/package-lock.json
      - run: npm ci
      # HOTFIX (2026-09-24): the generated client under public/_prisma/client is committed and ships AS COMMITTED (nothing
      # regenerates it in the cloud). npm ci's postinstall has just regenerated it from the committed schema copy, so the third
      # check in lib/db/prismaSchemaSync.test.ts only ever saw a fresh client and could not fail. If regenerating changed the
      # committed client's schema, the commit is missing the regenerated client. Only schema.prisma is compared: index.js and
      # edge.js embed the absolute output path, which differs per machine; schema.prisma is Prisma's formatted copy of the
      # schema and regenerates byte-identically (measured locally on 6.7.0).
      - name: generated Prisma client is committed in sync
        run: git diff --exit-code -- public/_prisma/client/schema.prisma
      - name: sync deploy Prisma schema
        run: node scripts/copy-prisma-schema.mjs
      # HOTFIX (2026-09-24): the hosting packager ships public/_prisma/schema.prisma AS COMMITTED, so a schema change
      # whose copy was not committed deploys a client that has never heard of the new tables. lib/db/prismaSchemaSync.test.ts
      # guards that, but here it ran after the step above had already rewritten the copy, so it could never fail in CI.
      # The copy is regenerated from the source: if that changed a committed file, the commit is missing it.
      - name: deploy Prisma schema is committed in sync
        run: git diff --exit-code -- public/_prisma/schema.prisma
      - run: npx prisma generate
      - name: type-check
        run: npx tsc --noEmit
      - name: unit tests
        run: npx vitest run
      # THE HEADLESS SUITES. Until 2026-09-16 these ran nowhere: CI was tsc + vitest +
      # build, so 186 mode gates and regression nets in scripts/ only ever ran when a
      # human remembered. That is how four assertions rotted red and were then waved
      # through as "pre-existing". ci-suite DISCOVERS them rather than listing them, so a
      # suite cannot be added and silently never run, and --require-db makes a skipped
      # database suite fatal here rather than quietly green.
      - name: headless suites
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-only-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
        run: |
          npx prisma db push --schema=prisma/schema.prisma --skip-generate
          npx tsx scripts/ci-suite.ts --require-db
      - name: production build
        env:
          NEXT_DIST_DIR: .next-verify
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-only-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
        run: npx next build
