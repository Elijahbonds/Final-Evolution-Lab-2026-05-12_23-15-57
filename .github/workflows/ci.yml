# Ship Pass 2, Phase 8 — the gate every push must clear: type-check, unit tests,
# production build. The gauntlet (browser captures) stays local; it needs a GPU.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FEL-full-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FEL-full-app/package-lock.json
      - run: npm ci
      - name: sync deploy Prisma schema
        run: node scripts/copy-prisma-schema.mjs
      - run: npx prisma generate
      - name: type-check
        run: npx tsc --noEmit
      - name: unit tests
        run: npx vitest run
      - name: production build
        env:
          NEXT_DIST_DIR: .next-verify
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-only-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
        run: npx next build
